<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت ساختمان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#1f2a37;--muted:#667085;--line:#d9dee5;--primary:#1f6f6b;--debt:#b42318;--credit:#0f7b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;font-weight:800;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--primary);font-weight:600;border-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
tfoot td{font-weight:600;border-bottom:0}
input,select,button{font:inherit}
input,select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
td input{width:100%;min-width:90px}
.btn{padding:7px 14px;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--primary)}
.btn.del{background:#fff;color:var(--debt);border-color:var(--line);padding:4px 10px}
:focus-visible{outline:3px solid #7fb8b4;outline-offset:1px}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.form input,.form select{flex:1 1 140px}
.neg{color:var(--debt)}.pos{color:var(--credit)}
.muted{color:var(--muted);font-size:.9rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sum b{display:block;font-size:1.15rem}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const KEY = 'building-manager-v1';
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const uid = () => Math.random().toString(36).slice(2, 9);
const fa = n => Math.round(n).toLocaleString('fa-IR');
const pad = n => String(n).padStart(2, '0');
const mk = (y, m) => `${y}-${pad(m)}`;

function currentJalali() {
  const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric' }).formatToParts(new Date());
  const get = t => Number(parts.find(p => p.type === t).value);
  return { y: get('year'), m: get('month') };
}

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { units: [], expenses: [], payments: [] }; }
  catch (e) { return { units: [], expenses: [], payments: [] }; }
}

// Compute per-unit report for a given period
function report(data, period) {
  const sumCoef = data.units.reduce((s, u) => s + Number(u.coef || 0), 0);
  const share = (u, p) => {
    const total = data.expenses.filter(e => e.period === p).reduce((s, e) => s + e.amount, 0);
    return sumCoef ? total * Number(u.coef || 0) / sumCoef : 0;
  };
  const periods = [...new Set(data.expenses.map(e => e.period))].filter(p => p <= period);
  return data.units.map(u => {
    const charge = share(u, period);
    const paid = data.payments.filter(p => p.unitId === u.id && p.period === period).reduce((s, p) => s + p.amount, 0);
    const allCharges = periods.reduce((s, p) => s + share(u, p), 0);
    const allPaid = data.payments.filter(p => p.unitId === u.id && p.period <= period).reduce((s, p) => s + p.amount, 0);
    return { id: u.id, name: u.name, owner: u.owner, coef: Number(u.coef || 0), charge, paid, balance: allPaid - allCharges };
  });
}

function Balance({ v }) {
  const r = Math.round(v);
  if (r === 0) return <span>۰</span>;
  return <span className={r < 0 ? 'neg' : 'pos'}>{fa(Math.abs(r))} {r < 0 ? 'بدهکار' : 'بستانکار'}</span>;
}

function App() {
  const [data, setData] = useState(load);
  const [tab, setTab] = useState('report');
  const cur = currentJalali();
  const [y, setY] = useState(cur.y);
  const [m, setM] = useState(cur.m);
  const period = mk(y, m);

  useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { console.error(e); }
  }, [data]);

  const set = (key, fn) => setData(d => ({ ...d, [key]: fn(d[key]) }));
  const rows = report(data, period);
  const totalExp = data.expenses.filter(e => e.period === period).reduce((s, e) => s + e.amount, 0);
  const totalPaid = rows.reduce((s, r) => s + r.paid, 0);
  const totalBal = rows.reduce((s, r) => s + r.balance, 0);

  // Unit actions
  const [uf, setUf] = useState({ name: '', owner: '', coef: '1' });
  const addUnit = () => {
    if (!uf.name.trim()) return alert('نام یا شماره واحد را وارد کن.');
    set('units', l => [...l, { id: uid(), name: uf.name.trim(), owner: uf.owner.trim(), coef: Number(uf.coef) || 0 }]);
    setUf({ name: '', owner: '', coef: '1' });
  };
  const editUnit = (id, k, v) => set('units', l => l.map(u => u.id === id ? { ...u, [k]: v } : u));
  const delUnit = id => {
    if (!confirm('این واحد و پرداخت‌هایش حذف شود؟')) return;
    set('units', l => l.filter(u => u.id !== id));
    set('payments', l => l.filter(p => p.unitId !== id));
  };

  // Expense actions
  const [ef, setEf] = useState({ title: '', amount: '' });
  const addExpense = () => {
    const amount = Number(ef.amount);
    if (!ef.title.trim() || !(amount > 0)) return alert('عنوان و مبلغ معتبر وارد کن.');
    set('expenses', l => [...l, { id: uid(), period, title: ef.title.trim(), amount }]);
    setEf({ title: '', amount: '' });
  };

  // Payment actions
  const [pf, setPf] = useState({ unitId: '', amount: '' });
  const addPayment = () => {
    const amount = Number(pf.amount);
    if (!pf.unitId || !(amount > 0)) return alert('واحد و مبلغ معتبر انتخاب کن.');
    set('payments', l => [...l, { id: uid(), period, unitId: pf.unitId, amount }]);
    setPf({ unitId: pf.unitId, amount: '' });
  };

  // Export / backup
  const exportXlsx = () => {
    const sheet = rows.map(r => ({
      'واحد': r.name, 'مالک/ساکن': r.owner, 'ضریب': r.coef,
      'شارژ ماه': Math.round(r.charge), 'پرداختی ماه': Math.round(r.paid), 'تراز تجمعی': Math.round(r.balance)
    }));
    const exp = data.expenses.filter(e => e.period === period).map(e => ({ 'عنوان': e.title, 'مبلغ': e.amount }));
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet), 'Report');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exp), 'Expenses');
    XLSX.writeFile(wb, `report-${period}.xlsx`);
  };
  const exportJson = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = 'building-backup.json';
    a.click();
  };
  const importJson = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.units) || !Array.isArray(d.expenses) || !Array.isArray(d.payments)) throw new Error();
        setData(d);
      } catch (err) { alert('فایل پشتیبان معتبر نیست.'); }
    };
    r.readAsText(f);
    e.target.value = '';
  };

  const unitName = id => (data.units.find(u => u.id === id) || {}).name || '—';
  const monthExpenses = data.expenses.filter(e => e.period === period);
  const monthPayments = data.payments.filter(p => p.period === period);

  return (
    <div className="wrap">
      <h1>مدیریت ساختمان</h1>
      <div className="bar">
        <select value={m} onChange={e => setM(Number(e.target.value))} aria-label="ماه">
          {MONTHS.map((n, i) => <option key={n} value={i + 1}>{n}</option>)}
        </select>
        <input type="number" value={y} onChange={e => setY(Number(e.target.value))} style={{ width: 90 }} aria-label="سال" />
      </div>
      <div className="tabs" role="tablist">
        {[['report', 'گزارش ماهانه'], ['units', 'واحدها'], ['expenses', 'هزینه‌ها'], ['payments', 'پرداخت‌ها']].map(([k, t]) =>
          <button key={k} role="tab" className={'tab' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}>{t}</button>)}
      </div>

      {tab === 'report' && <>
        <div className="sum">
          <div><span className="muted">هزینه کل ماه</span><b>{fa(totalExp)}</b></div>
          <div><span className="muted">دریافتی ماه</span><b>{fa(totalPaid)}</b></div>
          <div><span className="muted">تراز کل ساختمان</span><b><Balance v={totalBal} /></b></div>
        </div>
        <div className="card scroll">
          {rows.length === 0 ? <p className="muted">اول از تب «واحدها» واحد اضافه کن.</p> :
            <table>
              <thead><tr><th>واحد</th><th>مالک/ساکن</th><th>ضریب</th><th>شارژ ماه</th><th>پرداختی ماه</th><th>تراز تجمعی</th></tr></thead>
              <tbody>{rows.map(r => <tr key={r.id}>
                <td>{r.name}</td><td>{r.owner}</td><td>{fa(r.coef)}</td><td>{fa(r.charge)}</td><td>{fa(r.paid)}</td><td><Balance v={r.balance} /></td>
              </tr>)}</tbody>
            </table>}
        </div>
        <div className="bar">
          <button className="btn" onClick={exportXlsx} disabled={!rows.length}>خروجی Excel</button>
          <button className="btn ghost" onClick={exportJson}>دانلود Backup</button>
          <label className="btn ghost">بازیابی Backup<input type="file" accept=".json" onChange={importJson} hidden /></label>
        </div>
        <p className="muted">داده‌ها فقط در مرورگر همین دستگاه ذخیره می‌شن؛ پاک کردن اطلاعات مرورگر یعنی از دست رفتن داده. Backup بگیر.</p>
      </>}

      {tab === 'units' && <div className="card">
        <div className="form">
          <input placeholder="نام / شماره واحد" value={uf.name} onChange={e => setUf({ ...uf, name: e.target.value })} />
          <input placeholder="مالک / ساکن" value={uf.owner} onChange={e => setUf({ ...uf, owner: e.target.value })} />
          <input type="number" step="any" placeholder="ضریب" value={uf.coef} onChange={e => setUf({ ...uf, coef: e.target.value })} />
          <button className="btn" onClick={addUnit}>افزودن واحد</button>
        </div>
        <div className="scroll"><table>
          <thead><tr><th>واحد</th><th>مالک/ساکن</th><th>ضریب</th><th></th></tr></thead>
          <tbody>{data.units.map(u => <tr key={u.id}>
            <td><input value={u.name} onChange={e => editUnit(u.id, 'name', e.target.value)} /></td>
            <td><input value={u.owner} onChange={e => editUnit(u.id, 'owner', e.target.value)} /></td>
            <td><input type="number" step="any" value={u.coef} onChange={e => editUnit(u.id, 'coef', e.target.value)} /></td>
            <td><button className="btn del" onClick={() => delUnit(u.id)}>حذف</button></td>
          </tr>)}</tbody>
        </table></div>
        <p className="muted">تغییر ضریب یا افزودن واحد، گزارش ماه‌های قبل را هم دوباره محاسبه می‌کند.</p>
      </div>}

      {tab === 'expenses' && <div className="card">
        <p className="muted">هزینه‌های {MONTHS[m - 1]} {fa(y)}</p>
        <div className="form">
          <input placeholder="عنوان (مثلاً نظافت)" value={ef.title} onChange={e => setEf({ ...ef, title: e.target.value })} />
          <input type="number" placeholder="مبلغ" value={ef.amount} onChange={e => setEf({ ...ef, amount: e.target.value })} />
          <button className="btn" onClick={addExpense}>ثبت هزینه</button>
        </div>
        <div className="scroll"><table>
          <thead><tr><th>عنوان</th><th>مبلغ</th><th></th></tr></thead>
          <tbody>{monthExpenses.map(e => <tr key={e.id}><td>{e.title}</td><td>{fa(e.amount)}</td>
            <td><button className="btn del" onClick={() => set('expenses', l => l.filter(x => x.id !== e.id))}>حذف</button></td></tr>)}</tbody>
          <tfoot><tr><td>جمع</td><td>{fa(totalExp)}</td><td></td></tr></tfoot>
        </table></div>
      </div>}

      {tab === 'payments' && <div className="card">
        <p className="muted">پرداخت‌های {MONTHS[m - 1]} {fa(y)}</p>
        <div className="form">
          <select value={pf.unitId} onChange={e => setPf({ ...pf, unitId: e.target.value })}>
            <option value="">انتخاب واحد</option>
            {data.units.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
          <input type="number" placeholder="مبلغ" value={pf.amount} onChange={e => setPf({ ...pf, amount: e.target.value })} />
          <button className="btn" onClick={addPayment}>ثبت پرداخت</button>
        </div>
        <div className="scroll"><table>
          <thead><tr><th>واحد</th><th>مبلغ</th><th></th></tr></thead>
          <tbody>{monthPayments.map(p => <tr key={p.id}><td>{unitName(p.unitId)}</td><td>{fa(p.amount)}</td>
            <td><button className="btn del" onClick={() => set('payments', l => l.filter(x => x.id !== p.id))}>حذف</button></td></tr>)}</tbody>
        </table></div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
